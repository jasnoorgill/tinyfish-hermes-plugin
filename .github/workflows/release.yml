name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest tests/ -v

  publish:
    needs: test
    runs-on: ubuntu-latest
    # OIDC trusted publishing: PyPI mints a short-lived token from this
    # workflow identity, no long-lived secret to leak.
    # Configure at: https://pypi.org/manage/project/tinyfish-hermes-plugin/settings/publishing/
    permissions:
      id-token: write   # required for PyPI trusted publishing
    environment:
      name: pypi
      url: https://pypi.org/p/tinyfish-hermes-plugin
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.6.0
        with:
          python-version: '3.11'
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI via OIDC
        uses: pypa/gh-action-pypi-publish@67339c736fd9354cd4f8cb0b744f2b82a74bb1c4 # v1.12.3
        # No `with: password:` — OIDC removes the need for a stored API token.